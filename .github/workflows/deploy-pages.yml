name: Update data and deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Taiwan 06:00 = UTC 22:00 previous day
    - cron: "0 22 * * *"
    # Taiwan 18:00 = UTC 10:00
    - cron: "0 10 * * *"

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update market data
        run: node scripts/update-data.js

      - name: Add nojekyll marker
        run: touch outputs/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: outputs
          publish_branch: gh-pages
